# AgentCordon — Build from Source
#
# Usage (from a clone of this repository):
#   docker compose -f docker-compose.build.yml up -d --build
#
# Same zero-config experience as docker-compose.yml, but builds the image
# locally from this tree's Dockerfile instead of pulling from the registry.
# Use this whenever the published image does not match the tree you are on.
#
# Needs Docker with the Compose plugin (`docker compose version`). Without it,
# `docker build -t agentcordon:local .` plus the `docker run` form in
# docs/installation.md § "Plain docker run" does the same job -- it spells out
# this same build-then-run recipe.
#
# No .env required — the server auto-generates secrets on first run.
# Optionally create a .env to override port, admin credentials, etc.
#
# Container and volume names come from the Compose project name, which
# defaults to this directory's name. To run two independent stacks on one
# host, give each its own project name and host port:
#
#   COMPOSE_PROJECT_NAME=agentcordon-dev AGTCRDN_PORT=3141 \
#     docker compose -f docker-compose.build.yml up -d --build

services:
  agentcordon:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${AGTCRDN_PORT:-3140}:3140"
    volumes:
      - agentcordon-data:/data
    environment:
      - AGTCRDN_MASTER_SECRET=${AGTCRDN_MASTER_SECRET}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3140/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

volumes:
  agentcordon-data:
