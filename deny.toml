# cargo-deny configuration. CI runs `cargo deny check advisories licenses bans
# sources` on every push and pull request (.github/workflows/ci.yml); run the
# same locally with `cargo deny check`.
#
# Licences of the vendored (non-Cargo) assets — the Inter font and the Lucide
# icon sprite — are recorded in THIRD_PARTY_NOTICES.md; cargo-deny only sees
# the crate graph.

[graph]
all-features = true

[advisories]
version = 2
# Advisories are a hard failure. Everything ignored here has no fixed version
# to upgrade to; each entry says which of our dependencies pulls it in, so the
# list can be re-checked when that dependency moves.
ignore = [
    # core2 — unmaintained and yanked. Reached only at build time, through
    # rust-embed -> include-flate -> libflate. Goes away when rust-embed drops
    # include-flate.
    { id = "RUSTSEC-2026-0105", reason = "build-time only, via rust-embed -> include-flate; no upgrade exists" },
    # proc-macro-error2 — unmaintained proc-macro helper, build-time only.
    { id = "RUSTSEC-2026-0173", reason = "build-time only proc-macro dependency; no upgrade exists" },
    # smartstring — unmaintained, pulled in by rhai (the transform engine).
    # No CVE, no successor release; revisit when rhai moves off it.
    { id = "RUSTSEC-2026-0249", reason = "via rhai; unmaintained but not vulnerable, no upgrade exists" },
]

[licenses]
version = 2
# Every SPDX identifier below is one that some crate in Cargo.lock actually
# resolves to. Keep the list to what the tree needs: a licence that stops
# appearing should be removed rather than left as a standing allowance.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    # webpki-roots — the Mozilla CA bundle, redistributable data.
    "CDLA-Permissive-2.0",
    # File-level copyleft, and neither crate is modified: `colored`
    # (MPL-2.0) and `smartstring` (MPL-2.0+).
    "MPL-2.0",
    # ar_archive_writer, pulled in by cedar-policy via psm/stacker.
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# `allow-wildcard-paths` keeps path dependencies between the five workspace
# crates legal while still refusing `foo = "*"` on anything from the registry.
allow-wildcard-paths = true
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
