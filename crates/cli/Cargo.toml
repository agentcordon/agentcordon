[package]
name = "agentcordon-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Not on crates.io: the release artifacts are the tagged binaries and the
# container image, not a registry upload.
publish = false

[[bin]]
name = "agentcordon"
path = "src/main.rs"

[dependencies]
agentcordon-identity = { path = "../identity" }
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "3"
dirs = "5"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"

[package.metadata.release]
# The CHANGELOG is the workspace's, not this crate's. cargo-release runs
# pre-release-replacements once per released package, so only
# agent-cordon-server rewrites it (see release.toml).
pre-release-replacements = []
