  # ── MCP OAuth Apps ─────────────────────────────────────────────────────────
  /api/v1/mcp-servers/{id}/discover-tools:
    post:
      tags: [MCP]
      summary: Re-run tool discovery against an MCP server's upstream
      description: |
        Requires `manage_mcp_servers` on this server. Probes the upstream
        with the MCP handshake (`initialize` → `notifications/initialized` →
        `tools/list`), presenting the credential the broker would present —
        an upstream OAuth credential is exchanged for a fresh access token
        first — and writes what comes back onto the record.

        Install-time discovery is best-effort, so a server installed while
        its upstream was unreachable (down, or refused by the SSRF guard)
        has no tools; this is the retry, behind **Rediscover tools** on the
        server's detail page. A probe that fails answers 502 with the reason
        and emits an `mcp_tool_discovery_failed` audit event.
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The probe succeeded; `tool_count` is what was stored.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tool_count:
                            type: integer
        '403':
          description: The caller does not manage this MCP server.
        '404':
          description: No such MCP server.
        '502':
          description: The upstream probe failed; the message carries the reason.
  /api/v1/mcp-servers/{id}/generate-policies:
    post:
      tags: [MCP]
      summary: Generate Cedar policies for tool access
      description: |
        Admin only. Generates Cedar policies that grant specified agent tags
        access to specified tools on this MCP server.
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tools, agent_tags]
              properties:
                tools:
                  type: array
                  items:
                    type: string
                  description: List of tool names to generate policies for
                agent_tags:
                  type: array
                  items:
                    type: string
                  description: Agent tags to grant access to
      responses:
        '200':
          description: Policies generated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          policies_created:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                name:
                                  type: string
                                cedar_content:
                                  type: string
        '404':
          description: MCP server not found
  /api/v1/oauth/token:
    post:
      tags: [OAuth]
      summary: OAuth token endpoint
      description: |
        Exchanges credentials for an access token. Supports three grant types:
        - `authorization_code` with PKCE verification (legacy; used by the
          web dashboard and by MCP-OAuth client flows — **not** by workspace
          registration, which uses `urn:ietf:params:oauth:grant-type:device_code`)
        - `client_credentials` with Basic auth or body credentials
        - `urn:ietf:params:oauth:grant-type:device_code` — RFC 8628 Device
          Authorization Grant. Used by the broker to complete workspace
          registration after obtaining a `device_code` from
          `POST /oauth/device/code`. The broker polls this endpoint at the
          `interval` returned by `/oauth/device/code` (default 5 seconds)
          until the user approves or denies the code at `/activate`, or
          the code expires.

        Request body is form-encoded (application/x-www-form-urlencoded).

        Device-flow poll responses follow RFC 8628 §3.5 error codes:
        - `authorization_pending` — user has not yet approved or denied
        - `slow_down` — polling faster than `interval`; add 5s to the interval
        - `access_denied` — user clicked Deny at `/activate`
        - `expired_token` — device_code passed its 10-minute TTL
        - `invalid_grant` — device_code unknown or already consumed
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - client_credentials
                    - urn:ietf:params:oauth:grant-type:device_code
                code:
                  type: string
                  description: Required for authorization_code grant
                redirect_uri:
                  type: string
                  description: Required for authorization_code grant
                client_id:
                  type: string
                code_verifier:
                  type: string
                  description: Required for authorization_code grant (PKCE)
                client_secret:
                  type: string
                  description: For client_credentials via body params
                scope:
                  type: string
                  description: Space-delimited scopes for client_credentials
                device_code:
                  type: string
                  description: |
                    Required for the device_code grant. Opaque value
                    returned by `POST /oauth/device/code`.
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: Invalid grant, expired code, PKCE mismatch
        '401':
          description: Invalid client credentials
  /activate:
    get:
      tags: [OAuth]
      summary: Device-flow activation page
      description: |
        HTML page where a user enters the 4-word `user_code` shown in
        their terminal to approve a broker workspace registration.
        Requires an authenticated admin session. If the query parameter
        `user_code` is present, the form is pre-filled.
      parameters:
        - name: user_code
          in: query
          required: false
          schema:
            type: string
          description: Optional pre-fill for the activation form.
      responses:
        '200':
          description: HTML activation form
          content:
            text/html:
              schema:
                type: string
        '302':
          description: Redirect to `/login` if the user is not authenticated
    post:
      tags: [OAuth]
      summary: Submit a device-flow activation decision
      description: |
        Approves or denies a pending device code. Requires an authenticated
        admin session. On approval, the bound device code transitions from
        `pending` to `approved` and the broker's next poll of
        `POST /oauth/token` will receive an access token. Emits a
        `DeviceCodeApproved` or `DeviceCodeDenied` audit event.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [user_code, decision]
              properties:
                user_code:
                  type: string
                decision:
                  type: string
                  enum: [approve, deny]
      responses:
        '302':
          description: Redirect to `/activate/success` (on approve) or back to `/activate` with an error (on deny or unknown code)
        '400':
          description: Unknown, expired, or already-consumed user_code
        '401':
          description: Not authenticated
        '429':
          description: Rate limit exceeded
  /activate/success:
    get:
      tags: [OAuth]
      summary: Device-flow activation success page
      description: |
        Confirmation page shown after a user successfully approves a
        device code. Instructs the user to return to their terminal.
      responses:
        '200':
          description: HTML success page
          content:
            text/html:
              schema:
                type: string
  /install.ps1:
    get:
      tags: [Install]
      summary: Windows PowerShell installer script
      description: |
        Returns a PowerShell script that downloads both
        `agentcordon.exe` and `agentcordon-broker.exe` from the GitHub
        release matching this server's version, installs them to
        `%LOCALAPPDATA%\AgentCordon\bin`, and adds that directory to the
        user PATH. Intended invocation:

        ```powershell
        irm https://<server>/install.ps1 | iex
        ```

        The installer does not require admin rights and does not create a
        Windows service. The broker runs in the terminal it was started
        from and exits with that terminal, matching the Unix lifecycle.
      security: []
      responses:
        '200':
          description: PowerShell installer script
          content:
            text/plain:
              schema:
                type: string
  /api/v1/admin/rotate-key:
    post:
      tags: [Admin]
      summary: Re-encrypt all credentials under the current key
      description: |
        Admin only. Reads every credential, decrypts it with the current key,
        and re-encrypts with a new nonce. Useful after an encryption key rotation.
        Increments key_version for each credential.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Key rotation results
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          re_encrypted_count:
                            type: integer
                          total_credentials:
                            type: integer
                          errors:
                            type: array
                            items:
                              type: string
        '403':
          description: Access denied by policy

  # ============================================================================
  # Stats (v1.8.0)
  # ============================================================================
  /api/v1/stats:
    get:
      tags: [Stats]
      summary: Dashboard statistics
      description: |
        Returns aggregate counts for agents, credentials, devices, and the
        10 most recent audit events. Read-only; requires `view_audit` Cedar
        policy on System resource. Does not emit its own audit event.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      agents:
                        type: object
                        properties:
                          total:
                            type: integer
                          active:
                            type: integer
                      credentials:
                        type: object
                        properties:
                          total:
                            type: integer
                          llm_exposed:
                            type: integer
                      devices:
                        type: object
                        properties:
                          total:
                            type: integer
                          active:
                            type: integer
                      recent_events:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            event_type:
                              type: string
                            principal:
                              type: string
                            timestamp:
                              type: string
                              format: date-time
                            decision:
                              type: string
        '403':
          description: Access denied by policy

  # ============================================================================
  # Agent Tags (v1.8.0)
  # ============================================================================
  /api/v1/docs:
    get:
      tags: [Docs]
      summary: Full API documentation (JSON)
      description: |
        Unauthenticated. Returns the full machine-readable API documentation
        as raw JSON (not wrapped in ApiResponse envelope). Cached for 5 minutes.
      security: []
      responses:
        '200':
          description: API documentation
  /api/v1/docs/quickstart:
    get:
      tags: [Docs]
      summary: Quickstart guide (JSON)
      description: |
        Unauthenticated. Returns a concise getting-started guide as raw JSON.
        Cached for 5 minutes.
      security: []
      responses:
        '200':
          description: Quickstart documentation

  # ============================================================================
  # Enrollment Approval Page (HTML, not under /api/v1)
  # ============================================================================

  # ============================================================================
  # Workspaces
  # ============================================================================

  /api/v1/workspaces:
    get:
      tags: [Workspaces]
      summary: List workspaces
      description: Cedar-filtered to the workspaces the caller may manage.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: List of workspaces
        '403':
          description: Access denied by policy

  /api/v1/workspaces/{id}:
    get:
      tags: [Workspaces]
      summary: Get a workspace
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Workspace detail }
        '403': { description: Access denied by policy }
        '404': { description: Workspace not found }
    put:
      tags: [Workspaces]
      summary: Update a workspace
      description: |
        `enabled: false` disables the workspace (reversible); `enabled: true`
        re-enables it. A revoked workspace cannot be re-enabled and answers 409.
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                enabled: { type: boolean }
                tags:
                  type: array
                  items: { type: string }
      responses:
        '200': { description: Updated workspace }
        '403': { description: Access denied by policy }
        '404': { description: Workspace not found }
        '409': { description: "workspace is revoked; cannot enable" }
    delete:
      tags: [Workspaces]
      summary: Delete a workspace
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '403': { description: Access denied by policy }
        '404': { description: Workspace not found }

  /api/v1/workspaces/{id}/revoke:
    post:
      tags: [Workspaces]
      summary: Revoke a workspace (final)
      description: |
        Sets `status = revoked` and, in the same transaction, revokes the
        workspace's OAuth clients and every access and refresh token issued
        against them. Irreversible: a later `PUT {"enabled": true}` answers
        409 `workspace is revoked; cannot enable`. Authorizes
        `manage_workspaces` against the workspace and its owner.
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Workspace revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          status: { type: string, enum: [revoked] }
                          revoked_clients: { type: integer }
                          revoked_tokens: { type: integer }
        '403': { description: Access denied by policy }
        '404': { description: Workspace not found }

  /api/v1/workspaces/{id}/tags:
    post:
      tags: [Workspaces]
      summary: Add a tag to a workspace
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag]
              properties:
                tag: { type: string }
      responses:
        '200': { description: Updated tag list }
        '403': { description: Access denied by policy }

  /api/v1/workspaces/{id}/tags/{tag}:
    delete:
      tags: [Workspaces]
      summary: Remove a tag from a workspace
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: tag
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated tag list }
        '403': { description: Access denied by policy }

  /api/v1/workspaces/{id}/consents:
    get:
      tags: [Workspaces]
      summary: List OAuth consents granted for this workspace
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: List of consents }
        '403': { description: Access denied by policy }

  /api/v1/workspaces/{id}/consents/{user_id}:
    delete:
      tags: [Workspaces]
      summary: Withdraw one user's consent for this workspace
      description: Requires `manage_workspaces` on the workspace, checked before the lookup.
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Consent withdrawn }
        '403': { description: Access denied by policy }
        '404': { description: Consent not found }

  # ============================================================================
  # Workspace sync (broker-facing; OAuth bearer access token)
  # ============================================================================

  /api/v1/workspaces/mcp-servers:
    get:
      tags: [MCP]
      summary: MCP servers bound to the calling workspace
      description: |
        Cedar-filtered to servers the workspace may list, and enabled ones only.
        With `include_credentials=true` each entry carries ECIES-encrypted
        credential envelopes. For an OAuth-backed credential the envelope holds a
        short-lived upstream access token the **server** exchanged; the refresh
        token and the provider client secret never leave the server.
      security:
        - BearerJWT: []
      parameters:
        - name: include_credentials
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200': { description: MCP server configurations }
        '401': { description: Invalid or revoked access token }

  /api/v1/workspaces/mcp-tools:
    get:
      tags: [MCP]
      summary: Tools across every MCP server the calling workspace may list
      description: |
        Each entry carries the tool's `description` and `input_schema` as
        discovery found them.
      security:
        - BearerJWT: []
      responses:
        '200': { description: Tool list }
        '401': { description: Invalid or revoked access token }

  /api/v1/workspaces/mcp-authorize:
    post:
      tags: [MCP]
      summary: Authorize one MCP tool call
      description: Cedar `mcp_tool_call` check, audited, before the broker forwards.
      security:
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server_name, tool_name]
              properties:
                server_name: { type: string }
                tool_name: { type: string }
      responses:
        '200': { description: Permit }
        '403': { description: Forbid }

  # ============================================================================
  # Credential vending and reveal
  # ============================================================================

  /api/v1/credentials/by-name/{name}:
    get:
      tags: [Credentials]
      summary: Look a credential up by name
      description: Names are not unique; an ambiguous name answers 409 listing the matching ids.
      security:
        - BearerJWT: []
        - SessionCookie: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Credential summary }
        '404': { description: No such credential }
        '409': { description: Ambiguous credential name }

  /api/v1/credentials/{id}/reveal:
    post:
      tags: [Credentials]
      summary: Reveal a credential secret in the admin UI
      description: Emits a `CredentialSecretViewed` audit event.
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Plaintext secret }
        '403': { description: Access denied by policy }

  /api/v1/credentials/{id}/vend:
    post:
      tags: [Credentials]
      summary: Vend a credential by id as an ECIES envelope
      description: |
        The request names the call it serves (`method`, `target_url`) so the
        server can check the credential's `allowed_url_pattern` before any
        secret is decrypted. A target outside the pattern answers 403.
      security:
        - BearerJWT: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string }
                target_url: { type: string, format: uri }
      responses:
        '200': { description: ECIES vend envelope }
        '403': { description: Denied by Cedar policy or by allowed_url_pattern }

  /api/v1/credentials/vend-device/{name}:
    post:
      tags: [Credentials]
      summary: Vend a credential by name for the calling workspace
      description: |
        The broker's vend path. Carries `method` and `target_url`; the response
        includes the credential's `allowed_url_pattern` so the broker can
        re-check before injecting. For an `oauth2_client_credentials`
        credential the **server** performs the token exchange and seals only the
        resulting access token.
      security:
        - BearerJWT: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string }
                target_url: { type: string, format: uri }
      responses:
        '200': { description: ECIES vend envelope }
        '403': { description: Denied by Cedar policy or by allowed_url_pattern }
        '404': { description: No such credential }
        '409': { description: Ambiguous credential name }

  /api/v1/credentials/agent-store:
    post:
      tags: [Credentials]
      summary: Store a credential from an enrolled workspace
      description: Backs `agentcordon credentials create`.
      security:
        - BearerJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, service, secret_value]
              properties:
                name: { type: string }
                service: { type: string }
                secret_value: { type: string }
      responses:
        '201': { description: Credential created }
        '403': { description: Access denied by policy }

  # ============================================================================
  # Audit export
  # ============================================================================

  /api/v1/audit/export:
    get:
      tags: [Audit]
      summary: Export audit events as CSV
      description: Tenant-scoped exactly like the list endpoint, and CSV-injection safe.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: CSV export
          content:
            text/csv: {}
        '403': { description: Access denied by policy }

  /api/v1/audit/export/syslog:
    get:
      tags: [Audit]
      summary: Export audit events as RFC 5424 syslog
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Syslog export
          content:
            text/plain: {}
        '403': { description: Access denied by policy }

  /api/v1/audit/export/jsonl:
    get:
      tags: [Audit]
      summary: Export audit events as JSON Lines
      security:
        - SessionCookie: []
      responses:
        '200':
          description: JSONL export
          content:
            application/x-ndjson: {}
        '403': { description: Access denied by policy }

  # ============================================================================
  # Policy testing
  # ============================================================================

  /api/v1/policies/test:
    post:
      tags: [Policies]
      summary: Evaluate a hypothetical request against the loaded policy set
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                principal: { type: string }
                action: { type: string }
                resource: { type: string }
                context: { type: object }
      responses:
        '200': { description: Decision with contributing policies }
        '403': { description: Access denied by policy }

  /api/v1/policies/validate:
    post:
      tags: [Policies]
      summary: Validate Cedar policy text against the schema
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cedar_policy]
              properties:
                cedar_policy: { type: string }
      responses:
        '200': { description: Validation result }
        '400': { description: Policy does not parse or does not validate }

  # ============================================================================
  # Template catalogs
  # ============================================================================

  /api/v1/credential-templates:
    get:
      tags: [Settings]
      summary: Credential template catalog
      description: Built-ins plus anything in `AGTCRDN_CREDENTIAL_TEMPLATES_DIR`, read at startup.
      security:
        - SessionCookie: []
      responses:
        '200': { description: Template list }

  /api/v1/mcp-templates:
    get:
      tags: [MCP]
      summary: MCP marketplace catalog
      description: |
        Built-ins plus anything in `AGTCRDN_MCP_TEMPLATES_DIR`, keyed by
        template `key` so an override replaces a built-in. Read once at startup.
      security:
        - SessionCookie: []
      responses:
        '200': { description: Template list }

  /api/v1/policy-templates:
    get:
      tags: [Policies]
      summary: Policy template catalog
      description: Built-ins plus anything in `AGTCRDN_POLICY_TEMPLATES_DIR`, read at startup.
      security:
        - SessionCookie: []
      responses:
        '200': { description: Template list }

  # ============================================================================
  # OAuth provider clients (upstream providers AgentCordon registers with)
  # ============================================================================

  /api/v1/oauth-provider-clients:
    get:
      tags: [MCP]
      summary: List OAuth provider clients
      description: |
        Requires `manage_mcp_servers`, so an operator can see which client an
        origin uses. The client secret is never part of the response.
      security:
        - SessionCookie: []
      responses:
        '200': { description: Provider clients (client secrets never returned) }
        '403': { description: Caller does not hold manage_mcp_servers }
    post:
      tags: [MCP]
      summary: Create an OAuth provider client by hand
      description: |
        For an authorization server that does not support RFC 7591 Dynamic
        Client Registration. `authorization_server_url` is the lookup key and
        must be the bare origin (`scheme://host[:port]`, lowercase, no path,
        no trailing slash) — discovery normalizes the value it reads from the
        resource metadata and compares it to this field as stored.

        Requires `manage_oauth_provider_clients`, which the default policy
        grants to enabled admins only — the row is shared by every tenant with
        an MCP server at that origin.
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorization_server_url, client_id]
              properties:
                label: { type: string }
                authorization_server_url: { type: string, format: uri }
                authorize_endpoint: { type: string, format: uri }
                token_endpoint: { type: string, format: uri }
                client_id: { type: string }
                client_secret: { type: string }
                scopes: { type: string }
      responses:
        '201': { description: Provider client created }
        '403': { description: Caller does not hold manage_oauth_provider_clients }
        '409': { description: A client already exists for that authorization server origin }

  /api/v1/oauth-provider-clients/{id}:
    get:
      tags: [MCP]
      summary: Get an OAuth provider client
      description: Requires `manage_mcp_servers`. The client secret is never returned.
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Provider client }
        '403': { description: Caller does not hold manage_mcp_servers }
        '404': { description: Not found }
    put:
      tags: [MCP]
      summary: Update an OAuth provider client
      description: |
        Requires `manage_oauth_provider_clients` (admins only). Allowed even
        while credentials and MCP servers depend on the row — this is how a
        rotated provider secret gets in. The audit event names which fields
        changed and how many credentials and MCP servers were depending on the
        client, never the secret value.
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Updated }
        '403': { description: Caller does not hold manage_oauth_provider_clients }
        '404': { description: Not found }
        '409': { description: The row was created by dynamic client registration; re-register it instead }
    delete:
      tags: [MCP]
      summary: Delete an OAuth provider client
      description: |
        Requires `manage_oauth_provider_clients` (admins only). Refused while
        anything still authenticates at that origin.
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '403': { description: Caller does not hold manage_oauth_provider_clients }
        '404': { description: Not found }
        '409':
          description: |
            Still in use. The message names both counts — the
            `oauth2_user_authorization` credentials issued against this
            authorization server, and the OAuth2 MCP servers that authenticate
            with them.

  /api/v1/oauth-provider-clients/{id}/reregister:
    post:
      tags: [MCP]
      summary: Re-run discovery and dynamic client registration
      description: Requires `manage_oauth_provider_clients` (admins only).
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Row updated in place }
        '403': { description: Caller does not hold manage_oauth_provider_clients }
        '404': { description: Not found }

  # ============================================================================
  # OAuth 2.0 authorization server
  # ============================================================================

  /api/v1/oauth/authorize:
    get:
      tags: [OAuth]
      summary: Authorization endpoint (consent page)
      description: Authorization code flow with PKCE S256.
      parameters:
        - name: client_id
          in: query
          required: true
          schema: { type: string }
        - name: redirect_uri
          in: query
          required: true
          schema: { type: string, format: uri }
        - name: response_type
          in: query
          required: true
          schema: { type: string, enum: [code] }
        - name: scope
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
        - name: code_challenge
          in: query
          schema: { type: string }
        - name: code_challenge_method
          in: query
          schema: { type: string, enum: [S256] }
      responses:
        '200': { description: Consent page }
        '302': { description: Redirect to redirect_uri with a code }
        '400': { description: Invalid request }
    post:
      tags: [OAuth]
      summary: Record the user's consent decision
      security:
        - SessionCookie: []
      responses:
        '302': { description: Redirect to redirect_uri }
        '400': { description: Invalid request }

  /api/v1/oauth/device/code:
    post:
      tags: [OAuth]
      summary: RFC 8628 device authorization request
      description: |
        Rate-limited per source address. `verification_uri` and
        `verification_uri_complete` are built from `AGTCRDN_BASE_URL`; with that
        unset the server falls back to `http://` plus its listen address, which
        is not reachable from a browser in a container.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string }
                scope: { type: string }
                workspace_name: { type: string }
                public_key_hash: { type: string }
      responses:
        '200':
          description: Device code issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_code: { type: string }
                  user_code: { type: string }
                  verification_uri: { type: string, format: uri }
                  verification_uri_complete: { type: string, format: uri }
                  expires_in: { type: integer }
                  interval: { type: integer }
        '400': { description: invalid_scope or invalid_client }
        '429': { description: Rate limited }

  /api/v1/oauth/device/approve:
    post:
      tags: [OAuth]
      summary: Approve a device authorization by user code
      description: |
        Requires `manage_workspaces`. The presented `public_key_hash` must match
        the hash bound at issue time. Rate-limited per client address.
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code]
              properties:
                user_code: { type: string }
                public_key_hash: { type: string }
      responses:
        '200': { description: Approved }
        '403': { description: Access denied by policy }
        '404': { description: Unknown or expired user code }
        '429': { description: Rate limited }

  /api/v1/oauth/device/deny:
    post:
      tags: [OAuth]
      summary: Deny a device authorization by user code
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code]
              properties:
                user_code: { type: string }
      responses:
        '200': { description: Denied }
        '403': { description: Access denied by policy }
        '404': { description: Unknown or expired user code }

  /api/v1/oauth/revoke:
    post:
      tags: [OAuth]
      summary: RFC 7009 token revocation
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                token_type_hint: { type: string, enum: [access_token, refresh_token] }
      responses:
        '200': { description: Revoked (or already unknown) }

  /api/v1/oauth/clients:
    get:
      tags: [OAuth]
      summary: List OAuth clients
      security:
        - SessionCookie: []
      responses:
        '200': { description: Client list }
    post:
      tags: [OAuth]
      summary: Register an OAuth client
      security:
        - SessionCookie: []
      responses:
        '201': { description: Client created }

  /api/v1/oauth/clients/{id}:
    delete:
      tags: [OAuth]
      summary: Revoke an OAuth client
      security:
        - SessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Revoked }
        '404': { description: Not found }

  # ============================================================================
  # Server-sent events, spec, health
  # ============================================================================

  /api/v1/events/ui:
    get:
      tags: [Settings]
      summary: Server-sent event stream backing the admin UI's live updates
      security:
        - SessionCookie: []
      responses:
        '200':
          description: SSE stream
          content:
            text/event-stream: {}

  /api/v1/openapi.yaml:
    get:
      tags: [Settings]
      summary: This specification
      description: Unauthenticated, so an agent or developer can self-discover the API.
      responses:
        '200':
          description: OpenAPI 3.1 document
          content:
            text/yaml: {}

  /health:
    get:
      tags: [Settings]
      summary: Health check
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }

  /metrics:
    get:
      tags: [Settings]
      summary: Prometheus metrics
      responses:
        '200':
          description: Metrics in the Prometheus text exposition format
          content:
            text/plain: {}

  /install.sh:
    get:
      tags: [Settings]
      summary: POSIX sh installer for the CLI and the broker
      description: |
        `curl -fsSL <server>/install.sh | sh`. Detects the OS and architecture,
        downloads `agentcordon` and `agentcordon-broker` from the matching GitHub
        release, verifies both against the release's `SHA256SUMS` before
        installing, and puts them in `~/.local/bin`. The script never re-fetches
        itself, so it works from whatever URL you piped it from. Templated with
        `AGTCRDN_BASE_URL`, falling back to the request `Host`.
      responses:
        '200':
          description: The installer script
          content:
            text/x-shellscript: {}

