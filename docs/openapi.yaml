                template_key:
                  type: string
                  description: Key of the MCP template to provision (e.g. 'github')
                workspace_id:
                  type: string
                  format: uuid
                  description: Workspace to provision the server for
      responses:
        '200':
          description: |
            MCP server provisioned from template. Tool discovery runs
            best-effort as part of the install; when its probe fails the
            install still stands and `tool_discovery_error` carries the
            reason (an `mcp_tool_discovery_failed` audit event records it
