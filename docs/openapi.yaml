      responses:
        '200':
          description: MCP servers imported
        '400':
          description: Invalid input
  /api/v1/mcp-servers/provision:
    post:
      tags: [MCP]
      summary: Provision MCP server from marketplace template
      description: |
        Admin only. Provisions an MCP server from a marketplace template
        for a specific workspace. Creates the server record and optionally
        binds credentials. Requires manage_mcp_servers policy.
      security:
        - SessionCookie: []
      requestBody:
        required: true
