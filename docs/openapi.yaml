          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/McpServerResponse'
                          - type: object
                            properties:
                              tool_discovery_error:
                                type: string
                                description: |
                                  Why the install-time tool-discovery probe
                                  failed. Absent when it succeeded.
        '400':
          description: Invalid template key or input
        '404':
          description: Template not found
  /api/v1/mcp-servers/oauth/initiate:
    post:
      tags: [MCP]
      summary: Start OAuth flow for MCP server
      description: |
        Initiates an OAuth2 authorization code flow for an MCP server that
        requires OAuth authentication. Returns an authorization URL to redirect
        the user to the identity provider. Requires AGTCRDN_BASE_URL to be configured.
      security:
        - SessionCookie: []
      requestBody:
