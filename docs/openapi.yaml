                mcp_server_id:
                  type: string
                  format: uuid
                  description: ID of the MCP server to authenticate
      responses:
        '200':
          description: OAuth authorization URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          authorize_url:
                            type: string
                            format: uri
        '400':
          description: AGTCRDN_BASE_URL not configured or invalid input
  /api/v1/mcp-servers/oauth/callback:
    get:
      tags: [MCP]
      summary: OAuth callback handler for MCP servers
      description: |
        Handles the OAuth2 callback from the identity provider after user
