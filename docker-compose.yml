# AgentCordon — Zero-Config Production Compose
#
# Quick start (no .env required):
#   docker compose up -d
#
# This file PULLS a published image. If you are running from a clone of this
# repository — or the tag below has no release yet — use the build file
# instead, which compiles the image from the Dockerfile in this tree:
#
#   docker compose -f docker-compose.build.yml up -d --build
#
# Both need Docker with the Compose plugin (`docker compose version`). Without
# it, see docs/deployment.md for the equivalent `docker run`.
#
# The server auto-generates cryptographic secrets on first run
# and persists them to the /data volume. No env vars needed.
#
# Services:
#   agentcordon — Control plane (server) on port 3140
#
# Optional: create a .env file to override defaults:
#   AGTCRDN_PORT           — Server host port (default: 3140)
#   AGTCRDN_ROOT_USERNAME  — Admin username (default: root)
#   AGTCRDN_ROOT_PASSWORD  — Admin password (default: auto-generated, printed in logs)
#
# Container and volume names come from the Compose project name, which
# defaults to this directory's name. To run two independent stacks on one
# host, give each its own project name and host port:
#
#   COMPOSE_PROJECT_NAME=agentcordon-staging AGTCRDN_PORT=3141 docker compose up -d
#
# See .env.example for the common options, docs/configuration.md for all of them.

services:
  agentcordon:
    image: ghcr.io/agentcordon/agentcordon:latest
    command: ["agent-cordon-server"]
    ports:
      - "${AGTCRDN_PORT:-3140}:3140"
    volumes:
      - agentcordon-data:/data
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3140/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    restart: unless-stopped

volumes:
  agentcordon-data:
