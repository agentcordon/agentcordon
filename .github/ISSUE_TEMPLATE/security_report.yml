name: Security Concern
description: Report a security concern that is NOT a vulnerability. Vulnerabilities go to a private security advisory, never here.
labels: ["security", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        > **Do not report a vulnerability here.** Anything exploitable — credential exposure, authorization or policy bypass, key or crypto weakness, SSRF past the guard, a leak the scanner misses — goes to a **private security advisory**:
        >
        > **[Report a vulnerability](https://github.com/agentcordon/agentcordon/security/advisories/new)** (or **Security → Advisories → Report a vulnerability**)
        >
        > That draft is visible only to you and the maintainer. This form is public the moment you submit it. [`SECURITY.md`](https://github.com/agentcordon/agentcordon/blob/main/SECURITY.md) has the scope and the response times.

        This template is for security-adjacent concerns that are safe to discuss in the open: hardening suggestions, defence-in-depth improvements, or low-severity issues with no exploit path. If you are unsure which yours is, use the private advisory — it can always be moved here.

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Policy bypass / unexpected authorization
        - Credential leak in logs or responses
        - SSRF or URL validation gap
        - Encryption or key management concern
        - Authentication weakness
        - Audit logging gap
        - MCP tool authorization issue
        - Hardening suggestion
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the security concern. Include how the current behavior diverges from expected security properties.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction or proof of concept
      description: |
        Steps, commands, or a minimal config that demonstrates the concern.
        Redact any real credentials or sensitive data.
    validations:
      required: false

  - type: dropdown
    id: exploitability
    attributes:
      label: Exploitability
      description: How easily could this be exploited in a real deployment?
      options:
        - Requires local/admin access
        - Requires a specific misconfiguration
        - Exploitable with default settings
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AgentCordon version
      placeholder: "v0.1.2"
    validations:
      required: true
